          '<div>' + (p.hot.length ? '<ol class="dt-list" id="dt-list">' + p.hot.map(function (h, i) { return '<li><button class="dt-item" type="button" aria-expanded="' + (i === 0) + '"><i>' + (i + 1) + '</i><span>' + esc(h.label) + '</span></button><div class="dt-card"' + (i === 0 ? '' : ' hidden') + '>' + vh(h.spec.replace(/\s*\[VERIFY\]/, ''), /\[VERIFY\]/.test(h.spec)) + '</div></li>'; }).join('') + '</ol>' : '<p class="dt-nohot">Hotspots for ' + p.code + ' are defined with the final renders (ARM-14). Key parts: ' + esc(p.specs.slice(0, 4).map(function (s) { return s.l; }).join(', ')) + '.</p>') + '</div></div></div>' +
          // 3 datasheet
          '<div class="dt-sec"><h2>Datasheet<small>values with units</small></h2><table class="wf-spec" aria-label="' + p.code + ' specifications"><tbody>' + p.specs.map(function (s) { return '<tr><th>' + esc(s.l) + '</th><td>' + vh(s.v, s.verify) + ' <small>(' + esc(s.u) + ')</small></td></tr>'; }).join('') + (p.mcu ? '<tr><th>MCU / SoC</th><td>' + esc(p.mcu) + ' <small>(—)</small></td></tr>' : '') + '</tbody></table>' +
          (conf.length ? '<div class="dt-conf"><b>[VERIFY]</b> The catalogue and datasheet disagree on: ' + conf.map(function (s) { return esc(s.l) + ' (' + esc(s.verify) + ')'; }).join('; ') + '.</div>' : '') + '</div>' +
          // 4 pinout
          '<div class="dt-sec"><h2>Pinout and connections<small>X-ray lens</small></h2><div class="dt-exp"><div class="wf-ph" data-label="LINE ART: ' + p.code + ' · terminal map" data-ratio="16/9"></div><div>' + (p.hot.length ? '<ul class="wf-small" style="margin:0;padding-left:18px">' + p.hot.filter(function (h) { return /di|do|ai|can|rs485|power|eth|relays|acin|usb|pi|lipo/.test(h.id); }).map(function (h) { return '<li>' + esc(h.label) + '</li>'; }).join('') + '</ul>' : '<p class="wf-small">Terminal map follows the datasheet: <a href="' + esc(p.ds) + '" rel="noopener">open it on GitHub</a>.</p>') + '</div></div></div>' +
          // 5 mqtt
          '<div class="dt-sec"><h2>Integration<small>example format</small></h2><div class="dt-code-box"><pre id="dt-code" tabindex="0">' + esc(snippet(p)) + '</pre><button class="wf-btn dt-copy" type="button" id="dt-copy">Copy</button></div><p class="wf-small" style="margin-top:8px">' + (p.code === 'IA015' ? 'From the IA015 datasheet, rev B.' : 'Illustrative topics in a generic format. Check the datasheet for the real commands.') + '</p>' + (p.tasmota ? '<p style="margin-top:12px"><span class="dt-badge"><b>TASMOTA</b>Tasmota compatible (per catalogue)</span></p>' : '') + '</div>' +
          // 6 downloads
          '<div class="dt-sec"><h2>Downloads</h2><a class="wf-btn" href="' + esc(p.ds) + '" target="_blank" rel="noopener">' + (p.dsk === 'datasheet' ? p.code + ' datasheet (GitHub PDF)' : (p.line + ' catalogue (PDF, no separate datasheet)')) + '</a> <span class="wf-small">Opens in a new tab</span></div>' +
          // 7 related
          '<div class="dt-sec"><h2>Related boards</h2><div class="dt-rel">' + rel.map(function (r) { return '<a class="dt-bin" href="#' + r.slug + '"><span class="wf-ph" data-label="RENDER: ' + r.code + '" data-ratio="16/9"></span><b>' + r.code + '</b><span>' + esc(r.name) + '</span><span class="wf-small">' + esc(r.pw + ' · ' + r.ifaces.slice(0, 2).join(' · ')) + '</span></a>'; }).join('') + '</div></div>' +
          '<div class="dt-end"><h2>Need ' + p.code + '? Tell us the quantity.</h2><div class="dt-ctas"><a class="wf-btn wf-btn--primary" href="' + q + '&need=product">Request quote</a><a class="wf-btn" href="' + q + '&need=sample">Request sample</a><a class="wf-btn wf-btn--ghost" href="' + q + '&need=customised">Ask about customisation</a></div></div>' +
          '<div class="dt-annos"><aside class="wf-anno" data-ids="BR-08">Three end-of-page CTAs, each pre-filling the RFQ with this code: Request quote (<code>?product=' + p.slug + '&amp;need=product</code>), Request sample (<code>&amp;need=sample</code>), Ask about customisation (<code>&amp;need=customised</code>). Mobile: a sticky "Request quote" bar.</aside><aside class="wf-anno" data-ids="BR-03 BR-10">Deep links: <code>product.html#ia015</code>, <code>#ba011</code> and the other 15 codes render from the same data as the catalogue; an unknown hash falls back to IA015. The datasheet is a table with units, not marketing copy; disputed values carry [VERIFY].</aside><aside class="wf-anno" data-ids="MO-05 MO-06 BR-02">The explorer block is the H3 pattern scoped to one board: lenses and hotspots work as in H3. Hotspots exist for IA015, IA013, BA011 and IA003; others show key parts until renders exist. Copy button: clipboard, then the label reads "Copied" for 2 s.</aside></div>';
        document.title = 'ARMtronix · ' + p.code + ' ' + p.name + ' (wireframe)';
        document.getElementById('dt-sticky-q').href = q + '&need=product';
        // behaviour
        Array.prototype.forEach.call(root.querySelectorAll('.dt-lens button'), function (b) { b.addEventListener('click', function () { Array.prototype.forEach.call(root.querySelectorAll('.dt-lens button'), function (o) { o.setAttribute('aria-pressed', String(o === b)); }); document.getElementById('dt-ph').setAttribute('data-label', 'RENDER: ' + p.code + ' · ' + b.dataset.l + ' lens'); }); });
        Array.prototype.forEach.call(root.querySelectorAll('.dt-item'), function (b) { b.addEventListener('click', function () { var o = b.getAttribute('aria-expanded') !== 'true'; b.setAttribute('aria-expanded', String(o)); b.nextElementSibling.hidden = !o; }); });
        var cp = document.getElementById('dt-copy'); cp.addEventListener('click', function () { var t = document.getElementById('dt-code').textContent; try { navigator.clipboard.writeText(t); } catch (e) {} cp.textContent = 'Copied'; setTimeout(function () { cp.textContent = 'Copy'; }, 2000); });
        if (window.WF) window.WF.refresh(root);
      }
      window.addEventListener('hashchange', function () { render(); window.scrollTo({ top: 0 }); });
      render();
    })();
  </script>
